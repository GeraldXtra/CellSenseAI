services:
  - type: web
    name: cellsense-ai-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://geraldxtra.github.io
      - key: CLIENT_URL
        value: https://geraldxtra.github.io/cellsenseai
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: PRICE_UPDATER_CRON
        value: "0 2 * * *"
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
